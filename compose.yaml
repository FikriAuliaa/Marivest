# Jalankan:  docker compose up --watch
# Kode di folder src/ & public/ tersinkron otomatis; image di-build ulang bila package.json berubah.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: sync+restart
          path: ./next.config.ts
          target: /app/next.config.ts
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: ./postcss.config.mjs
          target: /app/postcss.config.mjs
