name: Supabase migrations

# Opsional. Menerapkan file di supabase/migrations ke project Supabase saat merge ke main.
# Jika tim mengubah skema langsung lewat SQL Editor dashboard, workflow ini cukup diabaikan.
# Butuh secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
  workflow_dispatch:

concurrency:
  group: db-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - name: Cek prasyarat
        id: pre
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Secrets Supabase belum diisi, migrasi dilewati."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -f supabase/config.toml ]; then
            echo "::notice::supabase/config.toml belum ada (jalankan 'npx supabase init'), migrasi dilewati."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.pre.outputs.run == 'true'
        with:
          version: latest

      - name: Push migrasi
        if: steps.pre.outputs.run == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"
