name: Docker dev image

# Memastikan Dockerfile.dev dan compose.yaml tetap bisa di-build.
# Hanya jalan bila file terkait berubah agar tidak memperlambat PR biasa.
on:
  pull_request:
    paths:
      - Dockerfile.dev
      - compose.yaml
      - .dockerignore
      - package.json
      - package-lock.json
      - .nvmrc
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validasi compose.yaml
        run: docker compose -f compose.yaml config --quiet

      - name: Build image dev
        run: docker build -f Dockerfile.dev -t marivest-dev:ci .
